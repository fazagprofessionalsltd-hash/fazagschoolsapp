  msg('Restoring...');for(const id in d.books||{}){try{await sb.storage.from('books').upload(id+'.pdf',new Blob([Uint8Array.from(atob(d.books[id]),c=>c.charCodeAt(0))],{type:'application/pdf'}),{contentType:'application/pdf',upsert:true})}catch(e){}}
  const nd=Object.assign(def(),d.data);try{if(SERVER){await sb.from('school_data').delete().neq('k','');base={};db=nd;await push();adopt(nd)}else adopt(nd)}catch(e){el.value='';return msg('Restore failed. Is the school server running?')}
  el.value='';if(!me)return;msg('Backup restored.');draw()};r.readAsText(f)}

 <div class="sm"><span><b>Total:</b> ${tot}</span><span><b>Average:</b> ${avg.toFixed(1)}%</span><span><b>Attendance:</b> ${pr} of ${days.length} days</span></div>
 ${traitsHtml(s,T)}
